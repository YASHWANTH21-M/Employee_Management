name: Employee Management CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  ECR_EMPLOYEE_REPO: employee-management-service
  ECR_GATEWAY_REPO: api-gateway-service
  ECR_CONFIG_REPO: config-server-service

jobs:
  # ============================================================
  # JOB 1: BUILD & UNIT TESTS (JUnit 5 + JaCoCo)
  # ============================================================
  build-and-test:
    name: Maven Build & JUnit 5 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run JUnit Tests with Maven
        run: mvn clean test -B

      - name: Generate JaCoCo Coverage Report
        run: mvn jacoco:report -B

      - name: Upload JaCoCo Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

  # ============================================================
  # JOB 2: SECURITY SCANNING (Trivy Vulnerability Scanner)
  # ============================================================
  security-scan:
    name: Security & Dependency Scan
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy FS Scan (Source & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Non-blocking scan report

  # ============================================================
  # JOB 3: DOCKER BUILD & TRIVY IMAGE SCAN
  # ============================================================
  docker-build:
    name: Docker Build & Image Scan
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Employee Service Image
        run: docker build -t employee-service:latest .

      - name: Build API Gateway Image
        run: docker build -t api-gateway:latest ./api-gateway

      - name: Build Config Server Image
        run: docker build -t config-server:latest ./config-server

      - name: Scan Employee Service Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'employee-service:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # ============================================================
  # JOB 4: AWS ECR PUSH & DEPLOYMENT (Triggers on main branch)
  # ============================================================
  deploy-to-aws:
    name: Push to Amazon ECR & Deploy to AWS
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check AWS Credentials Availability
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_SECRET_EXISTS=false" >> $GITHUB_ENV
            echo "AWS credentials not found in secrets. Skipping AWS deployment."
          else
            echo "AWS_SECRET_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        if: env.AWS_SECRET_EXISTS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.AWS_SECRET_EXISTS == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Images to Amazon ECR
        if: env.AWS_SECRET_EXISTS == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build and Push Employee Service
          docker build -t $ECR_REGISTRY/$ECR_EMPLOYEE_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_EMPLOYEE_REPO:latest .
          docker push $ECR_REGISTRY/$ECR_EMPLOYEE_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_EMPLOYEE_REPO:latest

          # Build and Push API Gateway
          docker build -t $ECR_REGISTRY/$ECR_GATEWAY_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_GATEWAY_REPO:latest ./api-gateway
          docker push $ECR_REGISTRY/$ECR_GATEWAY_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_GATEWAY_REPO:latest

          # Build and Push Config Server
          docker build -t $ECR_REGISTRY/$ECR_CONFIG_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_CONFIG_REPO:latest ./config-server
          docker push $ECR_REGISTRY/$ECR_CONFIG_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_CONFIG_REPO:latest

  # ============================================================
  # JOB 5: DEPLOYMENT VALIDATION (Health Check Verification)
  # ============================================================
  deployment-validation:
    name: Deployment Health Check Validation
    needs: deploy-to-aws
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Application Endpoint Health
        run: |
          if [ -n "${{ secrets.AWS_DEPLOYED_HOST }}" ]; then
            echo "Validating deployed application health..."
            curl --fail --connect-timeout 10 http://${{ secrets.AWS_DEPLOYED_HOST }}:8085/actuator/health || exit 1
            echo "Deployment validation completed successfully."
          else
            echo "AWS_DEPLOYED_HOST secret is not set. Skipping live health check validation."
          fi


