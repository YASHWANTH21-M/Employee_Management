server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:

      routes:
        # Route 1: Authentication Endpoints (Public + Rate Limiting)
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RateLimiterFilter

        # Route 2: Employee Service Endpoints (JWT Security + Rate Limiting)
        - id: employee-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/employees/**
          filters:
            - JwtAuthenticationFilter
            - RateLimiterFilter

