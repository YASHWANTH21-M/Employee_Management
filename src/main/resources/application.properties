spring.application.name=employee-management

# Active Profile & Optional Config Server
spring.profiles.active=dev
spring.config.import=optional:configserver:http://localhost:8888

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# ─── JWT ────────────────────────────────────────────────────────────────────
# 256-bit Base64-encoded secret key for HMAC-SHA signing
jwt.secret=bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMTIzNDU2Nzg=
# Token expiration: 24 hours in milliseconds
jwt.expiration=86400000

# ─── Actuator Management ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.example.employeemanagement=DEBUG
logging.level.org.springframework.security=INFO


